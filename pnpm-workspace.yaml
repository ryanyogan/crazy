packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  typescript: ^6.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  vite-plus: 0.3.2
  zod: ^4.6.5
  wrangler: ^4.133.0
  '@cloudflare/vite-plugin': ^1.54.11
  '@types/node': ^24.0.0
  react: ^19.2.0
  react-dom: ^19.2.0
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  # Pinned exactly: the Coordinator is the only module that may import it (ADR 0002).
  agents: 0.23.0

allowBuilds:
  esbuild: true
  lightningcss: true
  sharp: true
  workerd: true
  prisma: true
  '@prisma/engines': true
  '@clerk/shared': true
  core-js-pure: false
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
minimumReleaseAgeExclude:
  - '@cloudflare/vite-plugin@1.54.11'
  - '@tanstack/query-core@5.103.1'
  - '@tanstack/react-query@5.103.1'
  - '@tanstack/react-router-ssr-query@1.167.3'
  - '@tanstack/react-router@1.170.38'
  - '@tanstack/react-start-client@1.168.36'
  - '@tanstack/react-start-rsc@0.1.55'
  - '@tanstack/react-start-server@1.167.43'
  - '@tanstack/react-start@1.168.56'
  - '@tanstack/router-core@1.171.32'
  - '@tanstack/router-generator@1.167.38'
  - '@tanstack/router-plugin@1.168.40'
  - '@tanstack/router-ssr-query-core@1.169.3'
  - '@tanstack/start-client-core@1.170.32'
  - '@tanstack/start-plugin-core@1.171.46'
  - '@tanstack/start-server-core@1.169.37'
  - '@tanstack/start-storage-context@1.167.34'
  - miniflare@5.20260916.0-alpha
  - wrangler@4.133.0
  - lucide-react@1.47.0
